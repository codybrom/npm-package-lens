name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publishMS:
        description: "Publish to MS marketplace"
        type: boolean
        required: true
        default: true
      publishOVSX:
        description: "Publish to OpenVSX"
        type: boolean
        required: true
        default: true
      publishGH:
        description: "Publish to GitHub releases"
        type: boolean
        required: true
        default: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      packageName: ${{ steps.setup.outputs.packageName }}
      tag: ${{ steps.setup-tag.outputs.tag }}
      version: ${{ steps.setup-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Setup package path
        id: setup
        run: echo "packageName=$(node -e "console.log(require('./package.json').name + '-' + require('./package.json').version + '.vsix')")" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npx @vscode/vsce package --out ${{ steps.setup.outputs.packageName }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.setup.outputs.packageName }}
          path: ${{ steps.setup.outputs.packageName }}

      - name: Setup tag
        id: setup-tag
        run: |
          version=$(node -e "console.log(require('./package.json').version)")
          echo "tag=release/$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publishMS:
    name: Publish to MS marketplace
    runs-on: ubuntu-latest
    needs: package
    if: github.event.inputs.publishMS == 'true' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.packageName }}
      - name: Publish to MS marketplace
        run: npx @vscode/vsce publish --packagePath ./${{ needs.package.outputs.packageName }} -p ${{ secrets.VSCE_PAT }}

  publishOVSX:
    name: Publish to OpenVSX
    runs-on: ubuntu-latest
    needs: package
    if: github.event.inputs.publishOVSX == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.packageName }}
      - name: Publish to OpenVSX
        run: npx ovsx publish ./${{ needs.package.outputs.packageName }} -p ${{ secrets.OVSX_PAT }}

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: package
    if: github.event.inputs.publishGH == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.packageName }}

      - name: Tag release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${{ needs.package.outputs.tag }}" \
            -f sha="${{ github.sha }}"

      - name: Build release notes
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ needs.package.outputs.tag }}
          PACKAGE_NAME: ${{ needs.package.outputs.packageName }}
          REPO: ${{ github.repository }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > body.md

          # Trim leading/trailing blank lines
          sed -i -e '/./,$!d' body.md
          sed -i -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' body.md

          {
            echo ""
            echo "---"
            echo ""
            echo "📦 [\`.vsix\` download](https://github.com/$REPO/releases/download/$TAG/$PACKAGE_NAME) · [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=codybrom.npm-package-lens) · [Open VSX](https://open-vsx.org/extension/codybrom/npm-package-lens)"
          } >> body.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.package.outputs.tag }}" \
            "${{ needs.package.outputs.packageName }}" \
            --repo "${{ github.repository }}" \
            --title "npm Package Lens v${{ needs.package.outputs.version }}" \
            --notes-file body.md
